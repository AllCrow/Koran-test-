name: iPhone build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate bundled Quran against source snapshots
        run: |
          python3 scripts/verify_content.py
          python3 scripts/export_practice_references.py --verify
          python3 scripts/verify_assets.py
      - name: Test core, data and assessment contracts
        run: swift test --parallel
      - name: Check reproducible Xcode project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- Sakina.xcodeproj
      - name: Build iPhone simulator app
        run: >-
          xcodebuild -project Sakina.xcodeproj -scheme Sakina
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Test native reading state on an iPhone simulator
        shell: bash
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [device["udid"] for runtime, entries in devices.items()
                     if ".iOS-" in runtime for device in entries
                     if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not iphones:
              sys.exit("No available iPhone simulator was found")
          print(iphones[0])')
          xcodebuild -project Sakina.xcodeproj -scheme Sakina \
            -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sakina-native-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Export simulator test screenshots
        if: always()
        shell: bash
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path SimulatorAttachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sakina-simulator-screenshots
          path: SimulatorAttachments
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Sakina-simulator
          path: DerivedData/Build/Products/Debug-iphonesimulator/Sakina.app
          retention-days: 7
  backend-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio decoder and lightweight test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r backend/requirements-test.txt
      - name: Test API contracts and real audio decoding
        run: python -W error::ResourceWarning -m unittest discover -s backend/tests -v
  personal-iphone-package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build a physical iPhone app without signing credentials
        run: >-
          xcodebuild -project Sakina.xcodeproj -scheme Sakina
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Verify iPhoneOS platform and package for personal signing
        run: >-
          python3 scripts/package_iphone.py
          --app DerivedData/Build/Products/Release-iphoneos/Sakina.app
          --output Sakina-iPhone-unsigned.ipa --report iPhone-build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: Sakina-iPhone-personal-unsigned
          path: |
            Sakina-iPhone-unsigned.ipa
            iPhone-build-info.json
            docs/PERSONAL_IPHONE_INSTALL.md
          if-no-files-found: error
          retention-days: 7
  save-personal-download:
    needs: [validate-and-build, backend-contracts, personal-iphone-package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sakina-iPhone-personal-unsigned
      - name: Verify the tested artifact and prepare installation notes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          report = json.loads(Path('iPhone-build-info.json').read_text())
          ipa = Path('Sakina-iPhone-unsigned.ipa')
          assert report['source_commit'] == os.environ['GITHUB_SHA']
          assert report['ipa_sha256'] == hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert report['platform'] == 'iPhoneOS'
          assert report['requires_personal_signing_and_device_provisioning'] is True
          notes = (
              'Privat testbygge för personlig signering.\n\n'
              'IPA-filen är osignerad och kan inte installeras genom ett tryck i Filer. '
              'Följ den bifogade SideStore-guiden; en dator behövs för grundinstallationen.\n\n'
              f"Version: {report['app_version']} ({report['build_number']}). "
              f"Minsta iOS: {report['minimum_ios']}.\n\n"
              f"Testad källversion: `{report['source_commit']}`.\n\n"
              f"IPA SHA256: `{report['ipa_sha256']}`.\n\n"
              'Fysisk installation, mikrofon, ljudrutter och energiförbrukning är ännu inte verifierade.\n'
          )
          Path('release-notes.md').write_text(notes)
          PY
      - name: Save an owner-accessible draft download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="personal-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "Sakina – privat testbygge ${{ github.run_number }}" \
            --notes-file release-notes.md \
            Sakina-iPhone-unsigned.ipa iPhone-build-info.json docs/PERSONAL_IPHONE_INSTALL.md
          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --json url,isDraft,tagName,targetCommitish
